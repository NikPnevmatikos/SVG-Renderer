  </g>
  <g
     inkscape:label="Labels"
     inkscape:groupmode="layer"
     id="layer3">
    <text
       xml:space="preserve"
       style="font-size:4.2px;font-family:sans-serif;fill:#1f2937"
       x="12"
       y="40"
       id="text1"><tspan
         sodipodi:role="line"
         id="tspan1"
         x="12"
         y="40">Hall B</tspan></text>
    <text
       style="font-size:3.5px;font-style:italic;font-family:sans-serif;text-anchor:middle;fill:#7f1d1d"
