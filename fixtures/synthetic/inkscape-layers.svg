       id="rect1"
       width="110"
       height="70"
       x="5"
       y="5" />
    <path
       style="fill:none;stroke:#1b17b0;stroke-width:0.6;stroke-dasharray:2.4,1.2"
       d="M 60,5 V 75"
       id="path1" />
  </g>
  <g
     inkscape:label="Booths"
     inkscape:groupmode="layer"
     id="layer2"
     transform="translate(10,12)">
    <rect
       style="fill:#dbeafe;fill-opacity:1;stroke:#1e40af;stroke-width:0.4"
       id="booth-1"
       width="18"
       height="12"
       x="0"
       y="0" />
    <rect
       style="fill:#dcfce7;fill-opacity:1;stroke:#166534;stroke-width:0.4"
